<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18">
  <!--
    Значок tsukiko в строке меню. Шаблонная картинка: только чёрный цвет
    и альфа, никакого цвета — перекрашивает система, под тему и выделение.

    На 16 точках читается только силуэт, поэтому здесь лишь голова
    с двумя ушами и глаза, вырезанные насквозь. Носа и тела нет: на этом
    размере они превращаются в грязь.

    Сетка 18×18 — стандартный размер для NSStatusItem. Голова занимает
    16,8 × 14,6, поля оставлены системе.
    Пропорции сняты с mascot_reference_cutout.png.
  -->
  <mask id="eyes">
    <rect width="18" height="18" fill="#fff"/>
    <ellipse cx="5.85" cy="11.30" rx="1.95" ry="1.66" transform="rotate(-9 5.85 11.30)" fill="#000"/>
    <ellipse cx="12.15" cy="11.30" rx="1.95" ry="1.66" transform="rotate(9 12.15 11.30)" fill="#000"/>
  </mask>
  <path mask="url(#eyes)" fill="#000" d="
    M 2.45 1.00
    C 6.05 2.38 7.43 4.59 9.00 5.60
    C 10.57 4.59 11.95 2.38 15.55 1.00
    C 16.21 3.04 17.40 4.94 17.40 7.80
    C 17.40 11.02 16.19 12.17 14.71 13.00
    C 13.68 15.29 12.14 15.60 9.00 15.60
    C 5.86 15.60 4.32 15.29 3.29 13.00
    C 1.81 12.17 0.60 11.02 0.60 7.80
    C 0.60 4.94 1.79 3.04 2.45 1.00
    Z"/>
</svg>

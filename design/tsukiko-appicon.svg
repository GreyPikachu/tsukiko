      C 15.84 11.60 15.45 11.98 15.59 12.24
      C 15.73 12.54 16.43 12.67 16.76 12.90
      C 17.03 13.09 17.19 13.30 17.40 13.50
      C 17.23 13.70 17.14 13.91 16.90 14.10

      C 9.42 7.07 10.21 7.09 10.58 6.77
      C 10.98 6.43 11.03 5.66 11.30 5.08
      C 11.61 4.44 11.91 3.73 12.33 3.09
      C 12.77 2.41 13.36 1.76 13.87 1.10
      C 14.24 1.65 14.69 2.17 14.96 2.76

      C 3.19 15.38 2.75 15.08 2.28 14.83
      C 1.85 14.60 1.42 14.35 1.10 14.10
      C 0.86 13.91 0.77 13.70 0.60 13.50
      C 0.81 13.30 0.97 13.09 1.24 12.90
      C 1.57 12.67 2.27 12.54 2.41 12.24
      C 2.55 11.98 2.16 11.60 2.08 11.21
      C 1.98 10.76 1.86 10.34 1.86 9.72
      C 1.87 8.85 2.00 7.66 2.11 6.74
      C 2.21 5.95 2.32 5.27 2.48 4.58
      C 2.63 3.94 2.76 3.33 3.04 2.76
      C 3.31 2.17 3.76 1.65 4.13 1.10
      Z
      "/>
    <ellipse cx="5.64" cy="12.34" rx="1.34" ry="2.10" transform="rotate(3 5.64 12.34)" fill="#FFFFFF"/>
    <ellipse cx="12.36" cy="12.34" rx="1.34" ry="2.10" transform="rotate(-3 12.36 12.34)" fill="#FFFFFF"/>
  </g>
</svg>

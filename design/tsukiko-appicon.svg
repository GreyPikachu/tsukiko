<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Иконка приложения tsukiko: голова лунного кота на плитке.

    Голова, а не фигура целиком: на 16 и 32 точках фигура нечитаема,
    а голова с двумя ушами и парой глаз узнаётся сразу.

    Плитка — суперэллипс |x|⁵+|y|⁵=1, вписанный в сетку macOS:
    824×824 в холсте 1024×1024. Восемь кубических кривых приближают его
    с ошибкой меньше четверти точки.

    Цвета мерены по кадрам маскота: #8B8FCB — основной сине-сиреневый,
    к макушке светлее. Плитка тёмная, чтобы кот читался на 16 точках
    и на светлом, и на тёмном рабочем столе.

    На 16 точках рисуется tsukiko-appicon-16.svg — там щёчные выступы
    убраны, они на этом размере всё равно превращаются в грязь.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C5199"/>
      <stop offset="1" stop-color="#2C2F63"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B7BBF0"/>
      <stop offset="1" stop-color="#8B8FCB"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1B1D3A" flood-opacity="0.28"/>
    </filter>
  </defs>

  <path filter="url(#lift)" fill="url(#plate)" d="
    M 924.0 512.0
    C 924.0 708.5 928.9 812.4 870.7 870.7
    C 812.4 928.9 708.5 924.0 512.0 924.0
    C 315.5 924.0 211.6 928.9 153.3 870.7
    C  95.1 812.4 100.0 708.5 100.0 512.0
    C 100.0 315.5  95.1 211.6 153.3 153.3
    C 211.6  95.1 315.5 100.0 512.0 100.0
    C 708.5 100.0 812.4  95.1 870.7 153.3
    C 928.9 211.6 924.0 315.5 924.0 512.0
    Z"/>

  <!-- та же голова, что и в строке меню: сетка 18×18, увеличенная в 36 раз -->
  <g transform="translate(188 193.2) scale(36)">
    <path fill="url(#fur)" d="
      M 4.13 1.10
      C 4.64 1.76 5.23 2.41 5.67 3.09
      C 6.09 3.73 6.39 4.44 6.70 5.08
      C 6.97 5.66 7.02 6.43 7.42 6.77

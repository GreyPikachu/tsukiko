<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Иконка приложения на 16 точках. То же, что tsukiko-appicon.svg, но проще:

      · щёчных выступов нет — на 16 точках каждый выходит меньше точки
        шириной и превращается в грязное пятно у края;
      · глаза чуть крупнее (18 % ширины головы вместо 16 %), иначе
        от них остаётся серая клякса. Форма прежняя: высокий узкий овал.

    Уши и вырез между ними не трогаем: именно они опознают кота
    на этом размере, упрощать их нечем.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C5199"/>
      <stop offset="1" stop-color="#2C2F63"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B7BBF0"/>
      <stop offset="1" stop-color="#8B8FCB"/>
    </linearGradient>
  </defs>

  <path fill="url(#plate)" d="

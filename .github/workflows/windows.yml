# Сборка под Windows.
#
# На каждый пуш и pull request запускается быстрая проверка (линтер и тесты).
# Полная сборка приложения (tsukiko.exe), компиляция C++ движка, подготовка ffmpeg
# и создание установщика (tsukiko-setup.exe) выполняются только при наличии флага
# [build] / [release] в сообщении коммита, при пуше тега версии (v*), либо при
# ручном запуске (workflow_dispatch).

name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Проверка (линтер и тесты)
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Разбор
        run: flutter analyze

      - name: Тесты
        run: flutter test --reporter expanded

  build:
    name: Сборка дистрибутива (EXE и Setup)
    needs: check
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[build]') ||
      contains(github.event.head_commit.message, '[release]') ||
      contains(github.event.pull_request.title, '[build]') ||
      contains(github.event.pull_request.title, '[release]') ||
      github.event_name == 'workflow_dispatch'
    runs-on: windows-2025

    env:
      VULKAN_VERSION: 1.4.357.0

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Кэш движка
        id: engine-cache
        uses: actions/cache/restore@v6
        with:
          path: windows/Engine
          key: engine-${{ runner.os }}-${{ hashFiles('tool/engine-win.ps1', 'tool/nemo-engine-win.ps1', 'tool/recognizer-pcm.patch', 'tool/prompt-context.patch') }}

      - name: Vulkan SDK
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L `
            "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Движки Whisper и NeMo
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: .\tool\engine-win.ps1

      - name: Движок в кэш
        if: always() && steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: windows/Engine
          key: engine-${{ runner.os }}-${{ hashFiles('tool/engine-win.ps1', 'tool/nemo-engine-win.ps1', 'tool/recognizer-pcm.patch', 'tool/prompt-context.patch') }}

      - name: Кэш ffmpeg
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            windows/Engine/ffmpeg.exe
            windows/Engine/ffmpeg-LICENSE.txt
            windows/Engine/.ffmpeg-version
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('tool/build-ffmpeg.sh') }}

      - uses: msys2/setup-msys2@v2
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          update: false
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            tar
            xz

      - name: ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: ./tool/build-ffmpeg.sh

      - name: ffmpeg в кэш
        if: always() && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            windows/Engine/ffmpeg.exe
            windows/Engine/ffmpeg-LICENSE.txt
            windows/Engine/.ffmpeg-version
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('tool/build-ffmpeg.sh') }}

      - name: Папка журналов
        run: New-Item -ItemType Directory -Force -Path logs | Out-Null

      - run: flutter pub get

      - name: Приложение
        id: app
        run: flutter build windows --release 2>&1 | Tee-Object -FilePath logs/build.txt

      - name: tsukiko-transcribe
        run: dart compile exe bin/tsukiko_transcribe.dart -o build/windows/x64/runner/Release/tsukiko-transcribe.exe

      - name: Движок в релизную папку
        run: |
          $release = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path "$release/Engine" | Out-Null
          Copy-Item "windows/Engine/*" "$release/Engine" -Recurse -Force

      - name: Установщик
        id: installer
        if: hashFiles('windows/Engine/ffmpeg.exe') != ''
        run: |
          choco install innosetup --no-progress -y
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path build/installer | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" tool\installer.iss

      - name: Сказать про пропущенный установщик
        if: steps.installer.outcome == 'skipped'
        run: |
          Write-Host "::warning::Установщик не собран: нет windows/Engine/ffmpeg.exe."
          Write-Host "::warning::Без него не расшифровать m4a, opus и дорожки из видео."
          Write-Host "::warning::Как его получить — docs/сборка-и-выпуск.md"

      - name: Собранное
        if: always() && steps.app.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: tsukiko-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Журналы
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tsukiko-windows-logs
          path: logs/
          if-no-files-found: ignore

      - name: Установщик в артефакты
        if: steps.installer.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: tsukiko-setup
          path: build/installer/tsukiko-setup.exe
          if-no-files-found: error
